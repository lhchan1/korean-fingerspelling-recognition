<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8"><title>Realtime sequence test</title></head>
  <body>
    <pre id="result">RUNNING</pre>
    <script src="../public/vendor/tensorflow/tf.min.js"></script>
    <script type="module">
      import { WordSignInference } from "../src/inference.js";
      const output = document.querySelector("#result");
      try {
        const inference = new WordSignInference();
        await inference.initialize();
        let state;
        let earlyPrediction = null;
        for (let index = 0; index < 60; index += 1) {
          state = await inference.addFrame(new Array(146).fill(0), index * 67);
          if (index < 44 && state.prediction) throw new Error("45프레임 전에 추론했습니다.");
          if (index === 44) earlyPrediction = state.prediction;
        }
        if (!earlyPrediction?.early || !Number.isFinite(earlyPrediction.confidence)) {
          throw new Error("45프레임 조기 추론 결과가 생성되지 않았습니다.");
        }
        // Inference is throttled to 250ms; frame 60 need not emit a prediction.
        // Advance the clock beyond the interval to check the full-window result.
        state = await inference.addFrame(new Array(146).fill(0), 60 * 67 + 250);
        if (state.size !== 60 || !state.prediction || state.prediction.early ||
            !Number.isFinite(state.prediction.confidence)) {
          throw new Error("60프레임 버퍼의 전체 구간 추론에 실패했습니다.");
        }
        inference.model.dispose();
        output.textContent = JSON.stringify({
          status: "PASS",
          bufferSize: state.size,
          prediction: state.prediction,
          earlyPrediction,
        });
      } catch (error) {
        output.textContent = JSON.stringify({ status: "FAIL", error: error.stack || error.message });
      }
    </script>
  </body>
</html>
